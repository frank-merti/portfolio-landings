name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  next:
    name: Next.js (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [01-agency-next, 02-saas-next, 08-portfolio-next]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - name: Install
        run: npm ci
        working-directory: ${{ matrix.project }}
      - name: Lint
        run: npm run lint
        working-directory: ${{ matrix.project }}
      - name: Test
        run: npm test
        working-directory: ${{ matrix.project }}
      - name: Build
        run: npm run build
        working-directory: ${{ matrix.project }}
        env:
          GITHUB_PAGES: 'true'
          REPO_NAME: ${{ github.event.repository.name }}

  react:
    name: React (07-producto-react)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: 07-producto-react/package-lock.json
      - name: Install
        run: npm ci
        working-directory: 07-producto-react
      - name: Lint
        run: npm run lint
        working-directory: 07-producto-react
      - name: Test
        run: npm test
        working-directory: 07-producto-react
      - name: Build
        run: npm run build
        working-directory: 07-producto-react
        env:
          GITHUB_PAGES: 'true'

  python:
    name: Python (14-python-logistics)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
        working-directory: 14-python-logistics
      - name: Lint
        run: ruff check .
        working-directory: 14-python-logistics
      - name: Test
        run: python -m unittest discover -s tests -v
        working-directory: 14-python-logistics

  java:
    name: Java (13-java-biblioteca)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile
        run: javac -d out -encoding UTF-8 src/*.java
        working-directory: 13-java-biblioteca
      - name: Self test
        run: java -cp out SelfTest
        working-directory: 13-java-biblioteca

  fullstack:
    name: Full-Stack (15-taskboard-fullstack)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: 'file:./dev.db'
      SESSION_SECRET: 'ci-secret'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: 15-taskboard-fullstack/package-lock.json
      - name: Install
        run: npm ci
        working-directory: 15-taskboard-fullstack
      - name: Push database schema
        run: npx prisma db push --skip-generate
        working-directory: 15-taskboard-fullstack
      - name: Lint
        run: npm run lint
        working-directory: 15-taskboard-fullstack
      - name: Typecheck
        run: npm run typecheck
        working-directory: 15-taskboard-fullstack
      - name: Test
        run: npm test
        working-directory: 15-taskboard-fullstack
      - name: Build
        run: npm run build
        working-directory: 15-taskboard-fullstack
