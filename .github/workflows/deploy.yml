name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            01-agency-next/package-lock.json
            02-saas-next/package-lock.json
            07-producto-react/package-lock.json
            08-portfolio-next/package-lock.json

      - name: Build 01-agency-next
        working-directory: 01-agency-next
        env:
          GITHUB_PAGES: 'true'
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          npm ci
          npm run build

      - name: Build 02-saas-next
        working-directory: 02-saas-next
        env:
          GITHUB_PAGES: 'true'
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          npm ci
          npm run build

      - name: Build 08-portfolio-next
        working-directory: 08-portfolio-next
        env:
          GITHUB_PAGES: 'true'
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          npm ci
          npm run build

      - name: Build 07-producto-react
        working-directory: 07-producto-react
        env:
          GITHUB_PAGES: 'true'
        run: |
          npm ci
          npm run build

      - name: Assemble site
        run: |
          set -e
          rm -rf _site
          mkdir -p _site

          # Static landing pages (plain HTML + Tailwind CDN)
          for project in 03-restaurante 04-gimnasio 05-inmobiliaria 06-evento 09-cafe 10-travel 11-academy 12-clinic; do
            cp -a "$project" _site/
          done

          # Framework projects (compiled output)
          mkdir -p _site/01-agency-next _site/02-saas-next _site/07-producto-react _site/08-portfolio-next
          cp -a 01-agency-next/out/. _site/01-agency-next/
          cp -a 02-saas-next/out/. _site/02-saas-next/
          cp -a 07-producto-react/dist/. _site/07-producto-react/
          cp -a 08-portfolio-next/out/. _site/08-portfolio-next/

          # Root showcase page + SEO files
          cp index.html _site/index.html
          cp public/robots.txt public/sitemap.xml _site/

          # Console apps are published as source, not as a site
          for project in 13-java-biblioteca 14-python-logistics; do
            cp -a "$project" _site/
          done

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
